# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

buildConfig:
  installCommand: 'npm install'
  buildCommand: 'npm run build'

runConfig:
  # Safe to raise. This was pinned at 1 because the capture rate limiter kept
  # its window in an in-process Map, so N instances silently allowed N times the
  # intended limit. That window now lives in Firestore (src/lib/rate-limit.ts),
  # shared by every instance.
  #
  # One condition before raising it: LEAD_TOKEN_SECRET must be set. Unset, each
  # instance mints its own random signing secret, so a confirmation link issued
  # by one instance fails verification on another — intermittently, and looking
  # like a broken email rather than a missing secret.
  maxInstances: 1

env:
  # The plan finder on the homepage (src/lib/plan-finder/launch.ts):
  #   off        the homepage alone (/start still works)
  #   on         the plan finder in front of the homepage for everyone
  #   experiment half of visits get it, half the plain homepage (docs/03, P6)
  # Read when the site is built and in middleware, so it needs both. Switch it
  # on only after the privacy section of ENTRY_FUNNEL_NOTES.md is signed off.
  - variable: PLAN_FINDER_MODE
    value: "experiment"
    availability:
      - BUILD
      - RUNTIME
  - variable: GOOGLE_SHEET_ID
    value: 1IcVFTlCACocbeSbeDmN9HhIS2gC47pQj1JUe7grynnk
    availability:
      - BUILD
      - RUNTIME
  # Brevo SMTP relay — the same transport and sending domain the app
  # (app.hybridx.club) uses. Consolidated so both properties build one sender
  # reputation instead of two, and so deliverability is diagnosed in one place.
  - variable: SMTP_HOST
    value: smtp-relay.brevo.com
    availability:
      - RUNTIME
  - variable: SMTP_PORT
    value: "587"
    availability:
      - RUNTIME
  - variable: SMTP_SECURE
    value: "false"
    availability:
      - RUNTIME
  - variable: SMTP_FROM
    value: '"HybridX" <info@train.hybridx.club>'
    availability:
      - RUNTIME
  # ── Email deliverability ──────────────────────────────────────────────────
  # Send from the dedicated subdomain train.hybridx.club, authenticated in Brevo
  # with SPF + DKIM + DMARC. Replies go to the monitored root mailbox.
  #
  # Keep this aligned with the app's MARKETING_EMAIL_FROM domain: reputation is
  # built per sending domain, so two properties on two domains means warming
  # and defending two reputations for one brand.
  - variable: EMAIL_FROM
    value: '"HybridX" <info@train.hybridx.club>'
    availability:
      - RUNTIME
  - variable: EMAIL_REPLY_TO
    value: training@hybridx.club
    availability:
      - RUNTIME
  # Resend API key. RETIRED — leaving this set overrides the Brevo SMTP config
  # above, because getEmailProvider() prefers Resend whenever the key is
  # present. Remove the secret binding (and the secret) once a Brevo send has
  # been verified in production; until then it is the rollback path.
  # - variable: RESEND_API_KEY
  #   secret: RESEND_API_KEY
  #   availability:
  #     - RUNTIME

  # ── Marketing bridge ──────────────────────────────────────────────────────
  # Where the mailing system lives, and the shared secret used to push captured
  # leads into it and read the shared suppression list. Without these the site
  # still captures leads locally, but nothing can nurture them.
  - variable: MARKETING_APP_URL
    value: https://app.hybridx.club
    availability:
      - RUNTIME
  - variable: LEAD_BRIDGE_SECRET
    secret: LEAD_BRIDGE_SECRET
    availability:
      - RUNTIME
  # Comma-separated allow-list for the /admin/leads dashboard. Only Firebase
  # Auth users with one of these emails can view the leads collection.
  - variable: ADMIN_EMAILS
    value: jdlee9900@gmail.com
    availability:
      - RUNTIME
  # HMAC key signing the confirmed-opt-in download links for the HYROX race
  # day rules card (src/lib/lead-tokens.ts). Any long random string works:
  #   openssl rand -hex 32
  # If this is unset the app falls back to a per-process random secret, which
  # means confirmation links stop working after each restart.
  - variable: LEAD_TOKEN_SECRET
    secret: LEAD_TOKEN_SECRET
    availability:
      - RUNTIME
  # Bearer secret for /api/cron/marketing-maintenance, which drains the lead
  # outbox and refreshes the complainant mirror. Deliberately NOT
  # LEAD_BRIDGE_SECRET: that credential is held to push leads into the mailing
  # system, and a scheduler job should not be able to do that by holding this
  # one. Any long random string:
  #   openssl rand -hex 32
  # Unset, the endpoint refuses to run rather than being open — it triggers
  # cross-project writes, so a missing configuration has only one safe reading.
  - variable: CRON_SECRET
    secret: CRON_SECRET
    availability:
      - RUNTIME
  - variable: GOOGLE_SERVICE_ACCOUNT_EMAIL
    secret: GOOGLE_SERVICE_ACCOUNT_EMAIL
    availability:
      - RUNTIME
  - variable: GOOGLE_PRIVATE_KEY
    secret: GOOGLE_PRIVATE_KEY
    availability:
      - RUNTIME
  - variable: SMTP_USER
    secret: SMTP_USER
    availability:
      - RUNTIME
  - variable: SMTP_PASSWORD
    secret: SMTP_PASSWORD
    availability:
      - RUNTIME
  # Gemini API key powering the "Describe it, let AI build it" feature on the
  # Treadmill FIT/TCX Generator (src/ai/flows/parse-treadmill-workout-flow.ts).
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
    availability:
      - RUNTIME

  # ── Shop (HYROX Glasgow 2027 PDFs) ────────────────────────────────────────
  # docs/shop-setup.md is the full procedure. The plain values below are safe
  # as they are: with SHOP_SALES_OPEN false the landing page shows "Sales have
  # not opened yet", checkout returns 503, and nothing links to the page.
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://hybridx.club
    availability:
      - BUILD
      - RUNTIME
  # Read at build time too: the sitemap and the links to the shop page from
  # /calculators, /free-hyrox-plan and /hyrox-rule-changes-2026 are built
  # statically, so opening the shop is a rollout.
  #
  # "true" opens the shop. While the Stripe values below are TEST values only
  # test cards can pay, so do not leave it open on test values: go live in the
  # same sitting (docs/shop-setup.md, "Go live").
  #
  # EU VAT: sales are recorded by country (/admin/shop) and no tax is charged
  # while SHOP_TAX_ENABLED is "false". See "Decisions" in docs/shop-setup.md.
  - variable: SHOP_SALES_OPEN
    value: "true"
    availability:
      - BUILD
      - RUNTIME
  # true only after registering for the EU non-Union OSS and enabling Stripe
  # Tax. Every order records its location evidence either way.
  - variable: SHOP_TAX_ENABLED
    value: "false"
    availability:
      - RUNTIME
  - variable: SHOP_SALES_CLOSE_AT
    value: "2027-03-14T23:59:00Z"
    availability:
      - BUILD
      - RUNTIME
  - variable: SHOP_DOWNLOAD_LIMIT_PER_PRODUCT_DAY
    value: "10"
    availability:
      - RUNTIME
  - variable: SHOP_DOWNLOAD_LIMIT_TOTAL
    value: "50"
    availability:
      - RUNTIME
  # Uncomment once the sender is decided (TBC). Unset, order email goes from
  # EMAIL_FROM above.
  # - variable: SHOP_EMAIL_FROM
  #   value: '"HybridX" <hello@hybridx.club>'
  #   availability:
  #     - RUNTIME
  #
  # Stripe. These bind two secrets, and a `secret:` binding whose secret does
  # not exist fails the WHOLE build (see CLAUDE.md, "Deploy gotchas"), not just
  # the shop. Both must exist and be granted before this is deployed:
  #
  #   echo -n "sk_..."    | firebase apphosting:secrets:set STRIPE_SECRET_KEY --project hybridx-hub
  #   echo -n "whsec_..." | firebase apphosting:secrets:set STRIPE_WEBHOOK_SECRET --project hybridx-hub
  #   firebase apphosting:secrets:grantaccess STRIPE_SECRET_KEY,STRIPE_WEBHOOK_SECRET --project hybridx-hub --backend hybridx-web-x
  #
  # While testing, the secrets hold Stripe TEST values and the three prices
  # below are the TEST prices. Going live replaces all of them with live
  # values (docs/shop-setup.md, "Go live").
  - variable: STRIPE_SECRET_KEY
    secret: STRIPE_SECRET_KEY
    availability:
      - RUNTIME
  - variable: STRIPE_WEBHOOK_SECRET
    secret: STRIPE_WEBHOOK_SECRET
    availability:
      - RUNTIME
  # TEST price IDs. Replace with the live ones at go-live.
  - variable: STRIPE_PRICE_GUIDE
    value: price_1UMa9aGKLIEfAkDGQ2HzENZj
    availability:
      - RUNTIME
  - variable: STRIPE_PRICE_PACK
    value: price_1UMa9qGKLIEfAkDGMOgnXtaN
    availability:
      - RUNTIME
  - variable: STRIPE_PRICE_BUNDLE
    value: price_1UMaA6GKLIEfAkDG6CNrfWJm
    availability:
      - RUNTIME
